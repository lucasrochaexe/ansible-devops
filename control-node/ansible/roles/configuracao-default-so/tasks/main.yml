---
- name: upgrade de todos os pacotes
  dnf:
    name: "*"
    state: latest

- name: instalacao de git client
  dnf:
    name: git
    state: present

- name: instalacao de dependencias para o python pymysql
  dnf:
    name: 
      - python3
      - python3-pip
      - python3-PyMySQL
    state: present

- name: instalar cliente mariadb
  dnf:
    name: mariadb
    state: present

- name: garantir que o firewalld esteja instalado
  dnf:
    name: firewalld
    state: present    

- name: garantir que o firewalld esteja habilitado e iniciado
  service:
    name: firewalld
    state: started
    enabled: true    